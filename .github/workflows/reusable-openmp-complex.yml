name: Reusable OpenMP complex examples

on:
  workflow_call:
    inputs:
      package-name:
        description: "Bambu AppImage package name"
        required: true
        type: string
      test-compiler:
        description: "Compiler used during tests"
        required: true
        type: string
    secrets:
      CI_STORAGE_URL:
        required: true
      CI_STORAGE_USER:
        required: true
      CI_STORAGE_TOKEN:
        required: true

env:
  package-name: ${{inputs.package-name}}
  test-compiler: ${{inputs.test-compiler}}
  report-dir: test-reports
  storage-url: ${{secrets.CI_STORAGE_URL}}
  storage-user: ${{secrets.CI_STORAGE_USER}}
  storage-token: ${{secrets.CI_STORAGE_TOKEN}}
  dist-dir: panda_dist

jobs:
  openmp-complex-tests:
    runs-on: [self-hosted, long, xilinx]
    timeout-minutes: 600
    env:
      basename: openmp-complex
      args:
    strategy:
      fail-fast: false
      matrix:
        include:
          - basename: GAPBS
            script: ./examples/OpenMP/GAPBS/generic_GAPBS.sh
            batch: "xc7vx690t-3ffg1930_10.0"
          - basename: Mandelbrot 
            script: ./examples/OpenMP/mandelbrot/generic_mb.sh
            batch: "xc7vx690t-3ffg1930_10.0"
          - basename: MachSuite
            script: ./examples/MachSuite/generic_MachSuite_parallel_complete.sh
            batch: "xc7vx690t-3ffg1930_10.0"
          - basename: Parallel_Queries
            script: ./examples/parallel_queries/general_bambu_reduction_1DB.sh
            batch: "xc7vx690t-3ffg1930_10.0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: 'true'
      - name: Download PandA distribution
        uses: ./.github/actions/storage-download
        with:
          name: ${{env.package-name}}
          storage-url: "${{env.storage-url}}"
          username: "${{env.storage-user}}"
          password: "${{env.storage-token}}"
      - name: Generate out name
        id: get
        shell: bash
        run: |
          COMPILER="$(echo '${{env.test-compiler}}' | cut -d' ' -f1 | sed -r 's/I386_//g' | tr '[:upper:]' '[:lower:]')"
          OUTNAME="${COMPILER}_${{matrix.basename}}_${{env.basename}}"
          echo "outname=$OUTNAME" >> $GITHUB_OUTPUT
      - name: Launch test batch
        id: batch
        shell: bash
        env:
          OPENMP_BATCH_SCRIPT: ${{matrix.script}}
          OPENMP_BATCH_CONFIGURATIONS: ${{matrix.batch}}
          OPENMP_REPORT_DIR: ${{env.report-dir}}
          OPENMP_DIST_DIR: ${{env.dist-dir}}
          OPENMP_BATCH_COMPILER: ${{env.test-compiler}}
          OPENMP_EXTRA_ARGS: ${{env.args}} ${{matrix.args}}
        run: bash .github/scripts/run-openmp-batch.sh
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{steps.get.outputs.outname}}
          path: ${{steps.batch.outputs.test-reports-dir}}
