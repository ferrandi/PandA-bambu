name: Merge Pull Request
on:
  pull_request:
    types: [closed]

env:
  storage-url: ${{secrets.CI_STORAGE_URL}}
  storage-user: ${{secrets.CI_STORAGE_USER}}
  storage-token: ${{secrets.CI_STORAGE_TOKEN}}

jobs:
  remove-dist:
    if: github.event.pull_request.merged == false
    runs-on: [self-hosted]
    steps:
      - name: Remove PR storage directory
        shell: bash
        env:
          HEAD_REF: ${{github.head_ref}}
        run: |
          PR_URL="${{env.storage-url}}/${HEAD_REF}"
          AUTH=''
          if [[ ! -z '${{env.storage-user}}' ]]; then
            AUTH='-u ${{env.storage-user}}:${{env.storage-token}} '
          fi
          curl -L -X DELETE $AUTH "${PR_URL}/"
  move-dist:
    if: github.event.pull_request.merged == true
    runs-on: [self-hosted]
    steps:
      - name: Move PR storage directory to base branch
        shell: bash
        env:
          BASE_REF: ${{github.base_ref}}
          HEAD_REF: ${{github.head_ref}}
        run: |
          PR_URL="${{env.storage-url}}/${HEAD_REF}"
          BASE_URL="${{env.storage-url}}/${BASE_REF}"
          AUTH=''
          if [[ ! -z '${{env.storage-user}}' ]]; then
            AUTH='-u ${{env.storage-user}}:${{env.storage-token}} '
          fi
          curl -L -X MOVE $AUTH --header "Destination:${BASE_URL}/" "${PR_URL}/"
          curl -L -X DELETE $AUTH "${PR_URL}/"
  update-results:
    if: github.event.pull_request.merged == true
    runs-on: [self-hosted]
    steps:
      - name: Update base branch performance results
        shell: bash
        env:
          BASE_REF: ${{github.base_ref}}
          HEAD_REF: ${{github.head_ref}}
        run: |
          PR_URL="${{env.storage-url}}/results/${HEAD_REF}"
          BASE_URL="${{env.storage-url}}/results/${BASE_REF}"
          AUTH=''
          if [[ ! -z '${{env.storage-user}}' ]]; then
            AUTH='-u ${{env.storage-user}}:${{env.storage-token}} '
          fi
          curl -L -X MOVE $AUTH --header "Destination:${BASE_URL}/" "${PR_URL}/"
          curl -L -X DELETE $AUTH "${PR_URL}/"
