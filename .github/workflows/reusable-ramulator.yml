name: Reusable Ramulator co-simulation

on:
  workflow_call:
    inputs:
      package-name:
        description: Bambu distribution built by the calling workflow
        required: true
        type: string
    secrets:
      CI_STORAGE_URL:
        required: true
      CI_STORAGE_USER:
        required: true
      CI_STORAGE_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  co-simulation:
    name: Ramulator integration
    runs-on: [self-hosted]
    timeout-minutes: 120
    env:
      RAMULATOR_TEST_JOBS: '8'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Bambu
        uses: actions/checkout@v5
        with:
          submodules: false
          persist-credentials: false
      - name: Checkout pinned Ramulator
        run: git submodule update --init -- ext/ramulator2-no-spdlog
      - name: Download matching Bambu distribution
        uses: ./.github/actions/storage-download
        with:
          name: ${{ inputs.package-name }}
          storage-url: ${{ secrets.CI_STORAGE_URL }}
          username: ${{ secrets.CI_STORAGE_USER }}
          password: ${{ secrets.CI_STORAGE_TOKEN }}
      # Deliberately one job and one suite invocation: a per-case job matrix
      # would rebuild/reinstall Ramulator for every test.
      - name: Download Clang 13 when not bundled
        run: |
          bash .devcontainer/library-scripts/compiler-download.sh \
            "$PWD/panda_dist/compilers" clang-13 "${LOCAL_COMPILERS_BACKUP:-}"
      - name: Run Ramulator integration suites
        env:
          RAMULATOR_BUILD_JOBS: '4'
        run: >
          bash .github/scripts/run-ramulator-ci.sh short
          "$RUNNER_TEMP/ramulator-short-results-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Publish test summary
        if: ${{ !cancelled() }}
        run: |
          report_dir="$RUNNER_TEMP/ramulator-short-results-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ -f "$report_dir/out_ramulator_ci/summary.md" ]]; then
            cat "$report_dir/out_ramulator_ci/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload results and dependency build logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: ramulator-results-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ramulator-short-results-${{ github.run_id }}-${{ github.run_attempt }}/
            !${{ runner.temp }}/ramulator-short-results-${{ github.run_id }}-${{ github.run_attempt }}/**/test.vcd
      - name: Upload banked traces on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: ramulator-failure-traces-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: ${{ runner.temp }}/ramulator-short-results-${{ github.run_id }}-${{ github.run_attempt }}/out_ramulator_ci/**/test.vcd
