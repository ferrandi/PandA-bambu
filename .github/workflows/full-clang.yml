name: Full Regressions Clang

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "documentation/**"

  workflow_dispatch:

concurrency:
  group: full-clang-${{ github.head_ref }}
  cancel-in-progress: true

env:
  dist-dir: panda_dist

jobs:
  build:
    uses: ./.github/workflows/build-panda.yml
    with:
      package-name: bambu-clang-full
      compilers: clang-4.0,clang-5.0,clang-6.0,clang-7,clang-8,clang-9,clang-10,clang-11,clang-12,clang-13,clang-16,clang-19
      configure: --enable-opt --with-opt-level=2 --enable-release
    secrets: inherit

  simulate-all:
    needs: [build]
    runs-on: [self-hosted, long, mentor]
    env:
      report-dir: test-reports
      args: -c=--simulator=MODELSIM -c=--assert-debug
    strategy:
      fail-fast: false
      matrix:
        include:
          - outname: all_clang_softfloat-tests
            script: all_clang_softfloat-tests.sh
          - outname: all_clang_CHStone-frontend
            script: all_clang_CHStone-frontend.sh
          - outname: all_clang_softfloat-tests-vhdl
            script: all_clang_softfloat-tests.sh -c=-wH
          - outname: all_clang_CHStone-frontend-vhdl
            script: all_clang_CHStone-frontend.sh -c=-wH
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: "true"
      - name: Download PandA distribution
        uses: ./.github/actions/storage-download
        with:
          name: ${{needs.build.outputs.package-name}}
          storage-url: "${{secrets.CI_STORAGE_URL}}"
          username: "${{secrets.CI_STORAGE_USER}}"
          password: "${{secrets.CI_STORAGE_TOKEN}}"
      - name: Launch test suite
        id: suite
        shell: bash
        run: |
          source ${{env.dist-dir}}/settings.sh
          mkdir ${{env.report-dir}}
          out_dir="$PWD/${{env.report-dir}}"
          echo "test-reports-dir=$out_dir" >> $GITHUB_OUTPUT
          ./panda_regressions/hls/${{matrix.script}} --returnfail --junitdir="$out_dir" --summary="$out_dir/perf.xml" ${{env.args}} ${{matrix.args}}
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{matrix.outname}}
          path: ${{steps.suite.outputs.test-reports-dir}}

  grs:
    needs: [build, simulate-all]
    strategy:
      fail-fast: false
      matrix:
        compiler:
          [
            I386_CLANG4,
            I386_CLANG5,
            I386_CLANG6,
            I386_CLANG7,
            I386_CLANG8,
            I386_CLANG9,
            I386_CLANG10,
            I386_CLANG11,
            I386_CLANG12,
            I386_CLANG13,
            I386_CLANG16,
          ]
    name: "GRS (Compiler: ${{matrix.compiler}})"
    uses: ./.github/workflows/reusable-grs.yml
    with:
      package-name: ${{needs.build.outputs.package-name}}
      compiler: ${{matrix.compiler}}
      additional-args: -c=--simulator=VERILATOR -t150m
    secrets: inherit

  grs-sdc:
    needs: [build, grs]
    strategy:
      fail-fast: false
      matrix:
        compiler:
          [
            I386_CLANG4,
            I386_CLANG5,
            I386_CLANG6,
            I386_CLANG7,
            I386_CLANG8,
            I386_CLANG9,
            I386_CLANG10,
            I386_CLANG11,
            I386_CLANG12,
            I386_CLANG13,
            I386_CLANG16,
          ]
    name: "GRS SDC (Compiler: ${{matrix.compiler}})"
    uses: ./.github/workflows/reusable-grs.yml
    with:
      package-name: ${{needs.build.outputs.package-name}}
      compiler: ${{matrix.compiler}}
      additional-args: -c=--simulator=VERILATOR -t150m -c=--speculative-sdc-scheduling --skip-list 20040705-1,20040705-2,20040629-1
    secrets: inherit

  grs-vhdl:
    needs: [build, grs]
    uses: ./.github/workflows/reusable-grs-vhdl.yml
    with:
      package-name: ${{needs.build.outputs.package-name}}
      test-compilers: I386_CLANG4,I386_CLANG5,I386_CLANG6,I386_CLANG7,I386_CLANG8,I386_CLANG9,I386_CLANG10,I386_CLANG11,I386_CLANG12,I386_CLANG13,I386_CLANG16
    secrets: inherit

  examples:
    needs: [build, simulate-all]
    uses: ./.github/workflows/reusable-examples.yml
    with:
      package-name: ${{needs.build.outputs.package-name}}
      test-compiler: I386_CLANG16
    secrets: inherit

  openmp:
    needs: [build, simulate-all]
    strategy:
      fail-fast: false
      matrix:
        compiler:
          [
            I386_CLANG4,
            I386_CLANG5,
            I386_CLANG6,
            I386_CLANG7,
            I386_CLANG8,
            I386_CLANG9,
            I386_CLANG10,
            I386_CLANG11,
            I386_CLANG12,
            I386_CLANG13,
          ]
    uses: ./.github/workflows/reusable-openmp.yml
    with:
      package-name: ${{needs.build.outputs.package-name}}
      test-compiler: ${{matrix.compiler}}
    secrets: inherit  

  openmp-task:
    needs: [build, simulate-all]
    uses: ./.github/workflows/reusable-openmp-task.yml
    with:
      package-name: ${{needs.build.outputs.package-name}}
    secrets: inherit

  openmp-complex:
    needs: [build, simulate-all]
    uses: ./.github/workflows/reusable-openmp-complex.yml
    with:
      package-name: ${{needs.build.outputs.package-name}}
      test-compiler: I386_CLANG13
    secrets: inherit

  ramulator-long:
    name: Ramulator long benchmarks
    needs: [build]
    runs-on: [self-hosted, long]
    container: ubuntu:24.04
    timeout-minutes: 1440
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Install test tools
        run: |
          apt-get update
          apt-get install --no-install-recommends -y \
            ca-certificates git curl xz-utils build-essential cmake python3 \
            clang verilator binutils gettext-base bc
      - name: Checkout Bambu
        uses: actions/checkout@v5
        with:
          submodules: false
      - name: Checkout pinned benchmark collection and its dependencies
        run: |
          git submodule update --init -- examples/ramulator-examples
          git -C examples/ramulator-examples submodule update --init --recursive
      - name: Build and install pinned Ramulator once
        env:
          RAMULATOR_BUILD_JOBS: '4'
        run: |
          bash panda_regressions/hls/bambu_ramulator/prepare_ramulator.sh \
            "$RUNNER_TEMP/ramulator-long-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --checkout
      - name: Download matching Bambu distribution
        uses: ./.github/actions/storage-download
        with:
          name: ${{ needs.build.outputs.package-name }}
          storage-url: ${{ secrets.CI_STORAGE_URL }}
          username: ${{ secrets.CI_STORAGE_USER }}
          password: ${{ secrets.CI_STORAGE_TOKEN }}
      - name: Download Clang 13 when not bundled
        run: |
          bash .devcontainer/library-scripts/compiler-download.sh \
            "$PWD/panda_dist/compilers" clang-13 "${LOCAL_COMPILERS_BACKUP:-}"
      - name: Run all Ramulator benchmark suites
        run: |
          set -o pipefail
          source panda_dist/settings.sh
          export RAMULATOR2_DIR="$RUNNER_TEMP/ramulator-long-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/install"
          ./examples/ramulator-examples/run_tests.sh --all --no-compare --tag full-ci \
            2>&1 | tee ramulator-long.log
      - name: Upload benchmark results and dependency build logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: ramulator-long-results-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            ramulator-long.log
            examples/ramulator-examples/.runs/**/batch.json
            examples/ramulator-examples/.runs/**/metadata.json
            examples/ramulator-examples/.runs/**/summary.csv
            examples/ramulator-examples/.runs/**/cases/*.json
            examples/ramulator-examples/.runs/**/config_snapshot/**/inputs.json
            examples/ramulator-examples/.runs/**/config_snapshot/**/bambu_flags.json
            examples/ramulator-examples/.runs/**/config_snapshot/**/*.yaml
            examples/ramulator-examples/.runs/**/logs/*.gz
            examples/ramulator-examples/.runs/**/logs/*.xml
            ${{ runner.temp }}/ramulator-long-${{ github.run_id }}-${{ github.run_attempt }}/*.log
            ${{ runner.temp }}/ramulator-long-${{ github.run_id }}-${{ github.run_attempt }}/provenance.json

  success:
    if: ${{ !cancelled() }}
    needs: [grs, grs-vhdl, examples, ramulator-long]
    runs-on: [self-hosted]
    steps:
      - name: Check GCC Regression Simple status
        if: ${{ needs.grs.result != 'success' }}
        run: exit 1
      - name: Check GCC Regression Simple VHDL status
        if: ${{ needs.grs-vhdl.result != 'success' }}
        run: exit 1
      - name: Check Examples status
        if: ${{ needs.examples.result != 'success' }}
        run: exit 1
      - name: Check Ramulator long benchmarks status
        if: ${{ needs['ramulator-long'].result != 'success' }}
        run: exit 1
