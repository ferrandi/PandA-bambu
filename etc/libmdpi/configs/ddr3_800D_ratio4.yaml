# DDR3-800D (slowest JEDEC DDR3), 4GB x8 components, single rank.
#
# Nominal DRAM clock: 400 MHz (tCK = 2.5 ns).
# clock_ratio = 4   ->  DRAM runs 4x accelerator clock.
# Recommended accelerator clock: --clock-period=10.0 (100 MHz)
#   effective DRAM tick rate = 400 MHz  (exact match to DDR3-800)
#
# Cap check: ratio 4 <= 6  OK.
Frontend:
  impl: GEM5

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 4

  DRAM:
    impl: DDR3
    org:
      preset: DDR3_4Gb_x8
      channel: 1
      rank: 1
    timing:
      preset: DDR3_800D

  Controller:
    impl: Generic
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: AllBank
    RowPolicy:
      impl: ClosedRowPolicy
      cap: 4
    plugins:

  AddrMapper:
    impl: RoBaRaCoCh
