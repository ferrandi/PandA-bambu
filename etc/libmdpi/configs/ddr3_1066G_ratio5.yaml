# DDR3-1066G, 4Gb x8 components, single rank.
#
# Nominal DRAM clock: 533 MHz (tCK ~1.875 ns).
# MDPI derives the clock ratio from --clock-period and the model's tCK,
# retaining fractional phase. The filename is kept for existing scripts.
Frontend:
  impl: GEM5

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 1

  DRAM:
    impl: DDR3
    org:
      preset: DDR3_4Gb_x8
      channel: 1
      rank: 1
    timing:
      preset: DDR3_1066G

  Controller:
    impl: Generic
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: AllBank
    RowPolicy:
      impl: ClosedRowPolicy
      cap: 4
    plugins:

  AddrMapper:
    impl: RoBaRaCoCh
