# HYPOTHETICAL: Ramulator2 config for Xilinx Alveo U250 (xcu250) topology
# but with DDR3-2133M (overclocked top bin) instead of DDR4-2400. U250's
# MIG does not support DDR3; this is a "what-if" sensitivity study that
# holds the FPGA fabric constant and swaps only the external DRAM
# technology.
#
# Topology (matches U250 card layout):
#   - 4 independent DDR3 channels on the card
#   - 16 GB per channel (2 ranks x 8 chips x 8Gb x8 = 16 GB)
#   - DDR3 maxes out at 8Gb per chip, so we use 2 ranks to hit 16 GB/channel
#   - DDR3-2133M is the fastest DDR3 bin Ramulator knows about (CL=13).
#     This is above the official JEDEC DDR3 limit (1600) and is sometimes
#     found on enthusiast/server DIMMs.
#
# Frequency scaling (DRAM ticks per accelerator cycle):
#   DDR3-2133 real DRAM clock ~= 1066 MHz, tCK ~= 0.937 ns.
#   clock_ratio = 6 requires accelerator clock ~= 178 MHz
#   (--clock-period=5.625) for a cycle-accurate wall-clock match.
#   The benchmark scripts auto-select --clock-period=5.625 when this
#   preset is chosen; override with CLOCK_PERIOD=<ns> if needed.
Frontend:
  impl: GEM5

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 6

  DRAM:
    impl: DDR3
    org:
      preset: DDR3_8Gb_x8
      channel: 4
      rank: 2
    timing:
      preset: DDR3_2133M

  Controller:
    impl: Generic
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: AllBank
    RowPolicy:
      impl: ClosedRowPolicy
      cap: 4
    plugins:

  AddrMapper:
    impl: RoBaRaCoCh
