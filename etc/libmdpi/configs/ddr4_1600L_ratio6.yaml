# DDR4-1600L, 8Gb x8 components, single rank.
#
# Nominal DRAM clock: 800 MHz (tCK = 1.25 ns).
# MDPI derives the clock ratio from --clock-period and the model's tCK,
# retaining fractional phase. The filename is kept for existing scripts.
Frontend:
  impl: GEM5

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 1

  DRAM:
    impl: DDR4
    org:
      preset: DDR4_8Gb_x8
      channel: 1
      rank: 1
    timing:
      preset: DDR4_1600L

  Controller:
    impl: Generic
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: AllBank
    RowPolicy:
      impl: ClosedRowPolicy
      cap: 4
    plugins:

  AddrMapper:
    impl: RoBaRaCoCh
