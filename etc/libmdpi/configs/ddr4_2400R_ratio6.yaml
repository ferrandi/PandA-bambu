# DDR4-2400R (JEDEC standard CL=16-16-16), 8Gb x8, single rank.
#
# Nominal DRAM clock: 1200 MHz (tCK ~0.833 ns).
# clock_ratio = 6   ->  DRAM runs 6x accelerator clock.
# Recommended accelerator clock: --clock-period=5.0 (200 MHz) for exact match.
#   At --clock-period=10.0 (100 MHz) the effective DRAM tick rate is only
#   600 MHz (50% of real), so DDR4-2400 timings get stretched ~2x in wall
#   clock terms. Either accept this pessimism or bump the accelerator clock.
#
# Cap check: ratio 6 <= 6  OK.
Frontend:
  impl: GEM5

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 6

  DRAM:
    impl: DDR4
    org:
      preset: DDR4_8Gb_x8
      channel: 1
      rank: 1
    timing:
      preset: DDR4_2400R

  Controller:
    impl: Generic
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: AllBank
    RowPolicy:
      impl: ClosedRowPolicy
      cap: 4
    plugins:

  AddrMapper:
    impl: RoBaRaCoCh
